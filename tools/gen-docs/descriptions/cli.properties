# Descriptions for docs/reference/cli.md (tools/gen-docs): launcher.*, command.*, flag.<command>.<flag>.

# Launcher (dist/bin/gatf, dist/bin/gatf.cmd)
launcher.ui=Starts the web console by running the jar's `-configtool` mode: `gatf ui [port] [dir]`. Port defaults to `9080`, directory to the current one, and the bind host to `$GATF_UI_HOST` or `127.0.0.1`.
launcher.grid=`gatf grid up|down|status [chrome|firefox|edge]` manages an official `selenium/standalone-<browser>` Docker container on port `4444` (browser defaults to `chrome`). `up` prints an `export SELENIUM_REMOTE_URL=...` line, `down` removes the container, and `status` exits 0 when the grid is ready and 1 when not; any other subcommand exits 2.
launcher.tools=`gatf tools install [tool...]` provisions load-test tools and prints the launch command each one resolves to on this machine, or `UNAVAILABLE` when it cannot be set up. With no tool names it provisions `wperfk`, `vegeta`, `autocannon`, `wrk` and `wrk2`; the leading `install` word is optional.
launcher.version=Prints `gatf <version>` (from the `VERSION` file next to the launcher, else `unknown`) followed by the first line of `java -version`. `--version` and `-v` do the same on the shell launcher, and the command exits 0.
launcher.help=Prints the launcher usage text and exits 0. It is also shown when `gatf` is run with no arguments, and on the shell launcher for `-h` and `--help`.
launcher.passthrough=Any first argument that is not `ui`, `grid`, `tools`, `version` or `help` is passed unchanged to the jar (`java -jar lib/gatf.jar ...`), so `test`, `docs`, `import`, `export`, `plan`, `generate`, `merge-reports`, `mcp` and the `-executor` style modes work directly. Extra JVM flags come from `$GATF_JAVA_OPTS`.

# Jar commands (GatfCli)
command.-generator=`-generator <config>.xml|json` reads a generator configuration and generates API test cases from the configured source (JAX-RS or Spring classes, or WSDL). The file must end in `.xml` or `.json`; any other extension prints the usage text and exits 1.
command.-executor=`-executor <config>` runs an API suite and `-selenium <config>` runs a UI (seleasy) suite from the given `.xml` or `.json` config, using the current directory as the base path for test cases and output. It prints a quiet console summary, writes the CI reports, and exits 1 when any test failed or the run aborted. `gatf test` uses the same run path.
command.test=`gatf test [config] [options]` runs the suite in `config`, defaulting to `gatf-config.json` and then `gatf-config.xml` in the working directory. API or UI is decided by the config's `isSeleniumExecutor`. Exits 1 on failed tests, an aborted run or invalid arguments, and 0 otherwise.
command.docs=`gatf docs [config...] [options]` writes test-case documents, a requirements traceability matrix and coverage from the configured tests, into `gatf-docs` unless `--out` is given. Uses `gatf-results.json` from the config's output folder for status when present; exits 1 on a usage or read error.
command.import=`gatf import <type> <file|-> [options]` converts an external artifact (Playwright spec, JMeter plan, cURL commands, Postman collection, HAR, OpenAPI/Swagger, or a run's `network.har` as a load test) into a GATF test file and lists what could not be carried over. `-` reads the input from stdin. Refuses to overwrite an existing output without `--force`; exits 1 on error.
command.export=`gatf export <target> <file.sel|dir> [options]` exports seleasy scripts to another framework (targets `playwright` and `selenium-java`) and prints what was not carried over. A directory exports every `.sel` file that has an `open` statement and also writes `export-report.txt`. Exits 1 on any error or failed script.
command.plan=`gatf plan <crawl-coverage.json> [options]` turns a crawl map into a test plan written as JSON (`<name>-plan.json`) and Markdown beside the map. Every crawled route gets an entry with or without AI; the config's `ai` block only enriches it. Never overwrites existing outputs without `--force`.
command.generate=`gatf generate <n>-plan.json [options]` turns a test plan from `gatf plan` into seleasy scripts, each checked by the script validator and a dry-run compile. Only passing scripts are written, by default to `tests/generated/<plan name>/`. Exits 0 when all pass, 2 when some scripts fail the gate, and 1 on a usage or I/O error.
command.merge-reports=`gatf merge-reports <dir> <dir>... [options]` merges the output folders of a sharded run into one report (`gatf-results.json`, `gatf-junit.xml`, `index.html`, a copy of each input as `shard-<i>-of-<n>`). Exits 1 when the merged results contain failures or on error, else 0.
command.mcp=`gatf mcp [--root <project-dir>]` starts an MCP server on stdio for coding agents, exposing the tools `list_tests`, `lint`, `run`, `get_report`, `summarise_trace`, `record` and `crawl`. Only JSON-RPC goes to stdout; logs go to stderr.
command.-configtool=`-configtool <port> <host> <dir>` starts the web console on the given port and bind address with `dir` as the project folder (`.` means the current directory). All three arguments are required; `gatf ui` fills in the defaults.
command.-listener=`-listener [port] [workdir]` starts a distributed-run worker node that waits for a coordinator on a socket. Port defaults to `9567` (also when the value is not a number), and the working directory defaults to the current one and must exist.
command.-validate-sel=`-validate-sel <file.sel> [config] [workdir] [log]` compiles a seleasy script without running it and prints `SUCCESS` or `FAILURE` (with the compile error on stderr). `config` defaults to `gatf-config.json` if present in `workdir`, else `gatf-config.xml`; `workdir` defaults to `/workdir`, and a `file` without a path separator is looked up under `/workdir/`. A fifth value `true` enables logging. The process exits 0 in both cases.

# gatf test
flag.test.--changed=Takes a git range (for example `main...HEAD`) and runs only the UI scripts the change can reach, using the coverage index from an earlier traced run. When it cannot decide safely it runs everything and says why; when no script is affected it runs nothing and exits 0. UI suites only, and cannot be combined with `--watch`.
flag.test.--coverage-run=Folder of the earlier run whose traces form the coverage index for `--changed`; defaults to the newest run folder in the output directory. Only valid together with `--changed`.
flag.test.--explain=With `--changed`, prints each script with a run or skip verdict and the reason, and runs nothing (exit 0). Only valid together with `--changed`.
flag.test.--forbid-only=Fails the run if a subtest is marked `only`. A bare flag; overrides the config's `forbidOnly` for this run.
flag.test.--grep=Runs only tests whose title matches this regular expression (find semantics, case-sensitive). Repeatable; multiple `--grep` and `--tag` values are ORed, and the dependencies of a selected API test are pulled in. An invalid regex exits 1.
flag.test.--grep-invert=Excludes tests whose title matches this regular expression, applied after the include filters. Repeatable.
flag.test.--reporter=Comma-separated CI reports to write to the output folder: `junit` (`gatf-junit.xml`), `json` (`gatf-results.json`), `github` (annotations when `GITHUB_ACTIONS=true`), `docs` (test-case documents under the report folder's `docs`, which implies `json`) or `none`. Default is `junit,json,github`.
flag.test.--retries=Number of times a failing UI script is retried; overrides the config's `seleniumScriptRetryCount`. Must be an integer of 0 or more.
flag.test.--shard=Runs one slice of the test files, written `i/n` (1-based, for example `2/4`). Files are split deterministically by a hash of their path, so every machine computes the same split; a shard that gets no files is a green no-op. Combine the slices with `gatf merge-reports`.
flag.test.--source-maps=Folder holding the scripts' external `.map` files, used by `--changed` to map changed build output back to sources. Only valid together with `--changed`.
flag.test.--tag=Runs only tests carrying this `@tag`, with or without the leading `@`. Tags are `@word` tokens in an API test's name or description, or in the top `//` comment lines of a `.sel` file. Repeatable, ORed with `--grep`.
flag.test.--trace=Trace recording mode: `off`, `on`, `retain-on-failure` or `on-first-retry`; overrides the config's `traceMode`. Any other value exits 1.
flag.test.--update-snapshots=Rewrites the baselines of `screenshot compare` steps instead of failing on a difference. A bare flag; overrides the config's `updateSnapshots`.
flag.test.--watch=Runs the suite, then watches the project: saving a file re-runs the changed scripts plus the last failures; Enter re-runs everything with failures first, `f` re-runs only the failures and `q` quits. Each run is a child JVM; cannot be combined with `--changed`.
flag.test.--workers=Parallel workers; overrides the config's `numConcurrentExecutions`. Takes `N` or `N%` of the CPU cores (at least 1); UI scripts run file-parallel and never more workers than scripts are used.
flag.test.-g=Same as `--grep`.
flag.test.-j=Same as `--workers`.
flag.test.-t=Same as `--tag`.
flag.test.-u=Same as `--update-snapshots`.

# gatf docs
flag.docs.--format=Output format: `xlsx`, `csv` or `both` (default `both`). Any other value is an error and exits 1.
flag.docs.--out=Output directory for the documents, traceability matrix and coverage; defaults to `gatf-docs` in the working directory.
flag.docs.--req-pattern=Regular expression matched against the `@tag` tokens in test names, descriptions and script comments to find requirement IDs; the first capture group (else the tag without `@`) is the ID. An invalid pattern exits 1.
flag.docs.--requirements=Requirements list as a `.csv` or `.xlsx` file (columns `id`, `title`, `module`) for the traceability matrix. The file must exist.
flag.docs.--requirements-jql=Jira JQL query whose issues are imported as requirements, using Jira settings from environment variables. Rows from `--requirements` win on duplicate IDs.
flag.docs.--results=Path to a `gatf-results.json` supplying each test's status. Defaults to the one in the config's output folder when it exists, else every test is `not run`.
flag.docs.-o=Same as `--out`.

# gatf import
flag.import.--duration=Load-test duration for the `flow` import type (a run's `network.har` converted to a load test); passed through as given. Ignored by the other types.
flag.import.--engine=Load tool for the `flow` import type: `wperfk`, `vegeta`, `autocannon`, `wrk` or `wrk2`; defaults to `wperfk`.
flag.import.--filter=Regular expression on the request URL; only matching requests are imported.
flag.import.--force=Overwrites the output file (and any side files) if it already exists; without it an existing file exits 1.
flag.import.--name=Suite name for the generated file. Defaults to the input file name without extension, or `imported-<type>` for stdin.
flag.import.--negative=For the `openapi` and `swagger` types, also generates negative test cases. Ignored by the other types.
flag.import.--out=Output file path. Defaults to the name the importer chooses (for OpenAPI, `<name>.xml`) in the working directory.
flag.import.--rate=Request rate for the `flow` import type; passed through as given. Ignored by the other types.
flag.import.--users=Concurrent users for the `flow` import type; passed through as given. Ignored by the other types.
flag.import.-f=Same as `--force`.
flag.import.-o=Same as `--out`.

# gatf export
flag.export.--force=Overwrites existing output files; without it an existing target exits 1.
flag.export.--out=Output file for a single `.sel` input, or output directory for a directory input. Defaults to the generated file name in the working directory, or `export-<target>` for a directory.
flag.export.--strict-locators=Makes semantic locators strict in the exported code: they must match exactly one element. Off by default, where every locator acts on its first match, as seleasy does.
flag.export.-f=Same as `--force`.
flag.export.-o=Same as `--out`.

# gatf plan
flag.plan.--config=Config file whose `ai` block enriches the plan. Defaults to `gatf-config.json`, else `gatf-config.xml`, in the working directory; without one (or with a missing file) the plan is built without AI.
flag.plan.--coverage-run=Run folder whose traces mark which routes were already visited, so the plan can account for them.
flag.plan.--force=Overwrites existing plan files; without it an existing output exits 1.
flag.plan.--help=Prints the usage line and exits 0.
flag.plan.--max-routes=Maximum number of routes to plan, an integer from 1 to 5000; the default is 500. Routes beyond the cap are reported as not planned.
flag.plan.--md=Markdown output path. Defaults to the JSON output name with a `.md` extension.
flag.plan.--no-ai=Builds the plan without calling the AI client, so no AI-proposed journeys are added.
flag.plan.--out=JSON plan output path. Defaults to `<name>-plan.json` beside the crawl map, where `<name>` is the map's file name without `-coverage.json`.
flag.plan.-f=Same as `--force`.
flag.plan.-h=Same as `--help`.
flag.plan.-o=Same as `--out`.

# gatf generate
flag.generate.--ai=Uses AI for the repair loop when the config has an `ai` block (the default). Cancels an earlier `--no-ai`.
flag.generate.--config=Config file that gives the script gate its project settings and the `ai` block. Defaults to `gatf-config.json`, else `gatf-config.xml`, in the working directory; one must exist or the command exits 1.
flag.generate.--force=Overwrites existing scripts in the output folder; without it an existing script exits 1 and nothing is written.
flag.generate.--help=Prints the usage line and exits 0.
flag.generate.--include-side-effects=Also generates journeys that have side effects, which are skipped by default and listed in the summary.
flag.generate.--no-ai=Generates and gates without the AI repair loop.
flag.generate.--out=Output directory, which must be inside the working directory. Defaults to `tests/generated/<plan name>`.
flag.generate.-f=Same as `--force`.
flag.generate.-h=Same as `--help`.
flag.generate.-o=Same as `--out`.

# gatf merge-reports
flag.merge-reports.--out=Output directory for the merged report; defaults to `merged-report` in the working directory. Also accepted as `--out=<dir>`.
flag.merge-reports.-o=Same as `--out`.

# gatf mcp
flag.mcp.--help=Prints the usage line to stderr and exits 0.
flag.mcp.--root=Project directory the MCP tools operate on; defaults to the working directory and must exist. Also accepted as `--root=<dir>`.
flag.mcp.-h=Same as `--help`.
flag.mcp.-r=Same as `--root`.
