# Descriptions for docs/reference/configuration.md (tools/gen-docs). Field javadoc, when present, takes precedence.
# One line per key: Class (type intro) or Class.field. A field with neither javadoc nor a line here fails DocsDriftTest.

# Executor configuration
GatfExecutorConfig=The executor configuration: the root `gatf-execute-config` element of `gatf-config.xml`, or the top-level object of `gatf-config.json`. It controls API suites (base URL, auth, HTTP client, load and comparison runs) and seleasy UI suites (scripts, browsers, tracing, waits, setup scripts).
GatfExecutorConfig.baseUrl=Base URL used by every API test case that has no `baseUrl` of its own. In comparison runs it is the first environment, compared against `gatfTestDataConfig.compareEnvBaseUrls`.
GatfExecutorConfig.testCasesBasePath=Root directory of the project; `testCaseDir`, data files and `gatf-logging-api-int.xml` are resolved under it. When unset the web console uses its own root directory (in memory only, so the saved config stays portable); a set path must exist.
GatfExecutorConfig.testCaseDir=Sub-directory of `testCasesBasePath` holding the test files (`.xml`, `.json`, `.csv`, `.sel`). Blank or `.` means `testCasesBasePath` itself; when set it must exist. Resource files named in the config are looked up here first, then in `testCasesBasePath`, then as given.
GatfExecutorConfig.outFilesBasePath=Root directory for run output (reports, traces, logs). When unset the web console uses its own root directory (in memory only); a set path must exist.
GatfExecutorConfig.outFilesDir=Sub-directory of `outFilesBasePath` that receives the reports. The web console sets `out` when it is unset and creates the directory if it is missing.
GatfExecutorConfig.authEnabled=Turns on automatic authentication for API suites: the case whose `url` equals `authUrl` runs first, its token is extracted as `authExtractAuth` describes, and every `secure` case then carries it. When `true`, `authUrl`, `authExtractAuth` (4 parts) and `authParamsDetails` (4 parts) are validated at load.
GatfExecutorConfig.authUrl=URL of the login test case (matched against each case's `url`). That case runs before the others; for later `secure` cases the token is added unless the request goes to this URL.
GatfExecutorConfig.authExtractAuth=Four comma-separated parts `tokenName,source,variable,usage`. `source` is `json`, `xml`, `plain`, `header` or `cookie` (where `tokenName` is read from the login response); the value is stored as workflow variable `variable`; `usage` (`queryparam`, `header` or `cookie`) is how `secure` cases send it.
GatfExecutorConfig.authParamsDetails=Four comma-separated parts `userParam,userMode,passwordParam,passwordMode` telling the login case where to put the credentials taken from `authDataProvider`; modes are `header`, `postparam`, `queryparam` or `content`. The two param names are also the column names read from the provider rows.
GatfExecutorConfig.wsdlLocFile=File listing SOAP services, one `wsdlKey,wsdlUrl` line each. Each WSDL is parsed at start-up to build the request templates, SOAP actions and endpoints that SOAP test cases (`wsdlKey` + `operationName`) use.
GatfExecutorConfig.soapAuthEnabled=Turns on token authentication for SOAP cases: the case identified by `soapAuthWsdlKey` + `soapAuthOperation` runs first, and `secure` SOAP cases get the token appended to their endpoint as a query parameter.
GatfExecutorConfig.soapAuthWsdlKey=`wsdlKey` of the SOAP login operation (see `wsdlLocFile`); required when `soapAuthEnabled` is `true`.
GatfExecutorConfig.soapAuthOperation=Operation name of the SOAP login call; with `soapAuthWsdlKey` it identifies the auth case. Required when `soapAuthEnabled` is `true`.
GatfExecutorConfig.soapAuthExtractAuth=Three comma-separated parts `tokenName,paramName,queryparam`, validated when `soapAuthEnabled` is `true` (the third must be `queryparam`). The token is appended to `secure` SOAP endpoints as `paramName=<token>`; it is looked up through the variable named in `authExtractAuth`.
GatfExecutorConfig.numConcurrentExecutions=Parallelism. API suites: thread-pool size for running test cases in parallel (used when above 1 and there is more than one test). UI suites: the number of scripts run in parallel. Loaders fill `1` when unset.
GatfExecutorConfig.httpCompressionEnabled=Adds `Accept-Encoding: gzip` to API requests that do not set it; gzip responses are decoded. Some loaders (the Maven plugin default, the single-script seleasy loader) turn a `false` back on.
GatfExecutorConfig.httpConnectionTimeout=Connect timeout of the API HTTP client, in ms; null or 0 means no connect timeout. The web console and the seleasy loader fill `10000` when unset.
GatfExecutorConfig.httpRequestTimeout=Per-request timeout for API calls (and the `curl` plugin), in ms; applied only when above 0. The web console and the seleasy loader fill `10000` when unset.
GatfExecutorConfig.concurrentUserSimulationNum=Number of simulated concurrent users: above 1 the suite runs once per user (with `concurrentUserRampUpTime` spread across them) and reports show multiple runs. Above 1 also turns off UI tracing, and stateful file providers get one data file per user.
GatfExecutorConfig.testDataConfigFile=Path to a separate test-data file (`.xml`, otherwise JSON) holding a `gatfTestDataConfig` block. When set it is loaded at start-up and replaces the inline `gatfTestDataConfig`; the file must exist.
GatfExecutorConfig.authDataProvider=Name of the data provider whose rows supply the login credentials for the `authUrl` case (columns named by `authParamsDetails`). The row is picked by the case's simulation number, or at random when there are fewer rows.
GatfExecutorConfig.compareEnabled=Comparison mode: each API case is run against `baseUrl` and every URL in `gatfTestDataConfig.compareEnvBaseUrls`, and the responses are compared. It needs at least one compare URL different from `baseUrl`, and it turns load testing off.

# UI tracing and seleasy behaviour
GatfExecutorConfig.enableTrace=Legacy switch for the UI trace recorder: used only when `traceMode` is unset (`true` = `on`, `false` = `off`). Traces are captured for functional UI runs only (not load runs or more than one simulated user), on Chromium or BiDi browsers.
GatfExecutorConfig.traceMode=When to capture and keep a UI trace: `off`, `on`, `retain-on-failure` (keep only failed scripts' traces) or `on-first-retry` (capture only in the first retry round). Blank falls back to `enableTrace`; any other value is rejected when the config is loaded.
GatfExecutorConfig.traceProtocol=Transport the trace recorder uses: `cdp` (default), `bidi`, or `hybrid` (BiDi, plus CDP for CPU, coverage and video). Browsers without DevTools always use BiDi, and the worker browser pool may switch a run to `bidi`. It is also the default protocol for `route` interception (`-Dgatf.routeProtocol` overrides).
GatfExecutorConfig.browserApiSession=How `api`/`curl` plugin calls made from a UI script share the browser session: `sync` (default; send the browser's cookies and store `Set-Cookie` back into the browser), `send` (send only) or `off`. Other values are rejected at load.
GatfExecutorConfig.perfBudgets=Performance budgets checked against each UI script's trace, as comma-separated `metric<limit` items (e.g. `lcp<2500, requests<80, jsheap<50mb`). Metrics: `lcp`, `fcp`, `ttfb`, `dcl`, `load` (ms), `cls`, `jsheap`, `transfer`, `requests`, `failedRequests`, `consoleErrors`; unknown metrics or units are rejected at load, and a breach fails the script. Needs a captured trace.
GatfExecutorConfig.securityChecks=Passive security scan over each UI script's trace (mixed content, CSP, HSTS, clickjacking, cookie flags, CORS): `report` (default; findings in the report), `fail` (a medium or high finding fails the script) or `off`. Other values are rejected at load.
GatfExecutorConfig.autoWait=When `true`, element actions wait until the element is actionable (attached, visible, enabled, stable, not covered) before acting, for up to `actionTimeout`. Unset or `false` keeps the old behaviour (no waiting).
GatfExecutorConfig.actionTimeout=Auto-wait budget per action, in ms; null or 0 and below means 5000. Used only when `autoWait` is `true`.
GatfExecutorConfig.webFirstAssertions=When `true`, `??` value assertions retry until they pass or `assertTimeout` runs out, instead of failing at once. Unset or `false` keeps the fail-at-once behaviour.
GatfExecutorConfig.assertTimeout=Retry budget per web-first assertion, in ms; null or 0 and below means 5000. Used only when `webFirstAssertions` is `true`.
GatfExecutorConfig.testIdAttribute=Attribute that `testid@` locators match; unset means `data-testid`. The recorder, healer and crawler also use it when proposing locators.
GatfExecutorConfig.strictLocators=When `true`, a semantic locator (`role@`, `label@`, `testid@` and so on) that matches more than one element fails and lists the candidates. Unset or `false` takes the first match.
GatfExecutorConfig.storageState=File for the browser storage state (cookies and web storage). Every UI script loads it right after its browser opens; the `loginOnce` script saves its state to it when it finishes.
GatfExecutorConfig.loginOnce=Script run once before the UI suite (first round only) to log in; its browser state is saved to `storageState` so the suite's scripts start logged in. It is never run as one of the suite's scripts; without `storageState` the login is not saved (a warning is printed).
GatfExecutorConfig.browserContexts=Per-test browser isolation: `subtest` = every top-level subtest runs in a fresh browser context of the script's browser; `worker` = each worker keeps one browser and every script runs in a fresh context of it. Unset, `off` or any other value keeps the shared context.
GatfExecutorConfig.globalSetup=Script run once before the UI suite (before `loginOnce`), only in the first round. It is never run as a suite script, and if it fails the run stops.
GatfExecutorConfig.globalTeardown=Script run once after the UI suite's last round, also when the suite failed. It is never run as a suite script.
GatfExecutorConfig.browserApiStorageToken=Web-storage entry holding a bearer token that `api`/`curl` plugin calls from UI scripts send as `Authorization` (unless the case sets that header), written `[localStorage:|sessionStorage:]key[#json.field]`. Unset = no token.
GatfExecutorConfig.browserApiStorageTokenHosts=Extra hosts (`host`, or `*.domain` for a domain and its subdomains) that `browserApiStorageToken` may be sent to besides the open page's own host. The token is never sent from an https page to plain http.
GatfExecutorConfig.forbidOnly=When `true`, a subtest marked `only` is a transpile error, so a focused test cannot slip into CI (the CLI flag `gatf test --forbid-only` does the same). Unset or `false` allows it.
GatfExecutorConfig.updateSnapshots=When `true`, `screenshot compare` rewrites its baselines instead of comparing (also `-Dgatf.updateSnapshots=true` or `gatf test --update-snapshots`).
GatfExecutorConfig.traceNetwork=Record network requests and responses in the UI trace (default `true`).
GatfExecutorConfig.traceConsole=Record browser console messages in the UI trace (default `true`).
GatfExecutorConfig.traceSnapshots=Record page snapshots (DOM HTML plus a screenshot) in the UI trace (default `true`).
GatfExecutorConfig.traceMaxBodyKb=Largest response body kept per request in the trace, in KB (default 512; 0 or less keeps the default).
GatfExecutorConfig.traceMaxTotalMb=Total response-body budget per trace, in MB (default 64; 0 or less keeps the default).
GatfExecutorConfig.traceMetrics=Sample browser performance and memory metrics into the trace every `traceMetricsIntervalMs` (default `true`).
GatfExecutorConfig.traceMetricsIntervalMs=Metrics sampling interval, in ms (default 1000; 0 or less keeps the default).
GatfExecutorConfig.traceWebVitals=Record web vitals (FCP, LCP, TTFB, DCL, load) from the Performance Timeline in the trace (default `true`); `perfBudgets` on these metrics need it.
GatfExecutorConfig.traceCpu=Record a CPU sampling profile in the trace (default `false`; adds overhead). Needs a CDP-capable browser (`cdp` or `hybrid`).
GatfExecutorConfig.traceCoverage=Record JS and CSS coverage in the trace (default `false`; adds overhead). Needs a CDP-capable browser (`cdp` or `hybrid`).
GatfExecutorConfig.traceVideo=Record a screencast video (mp4) of the page in the trace (default `false`; the heaviest option).
GatfExecutorConfig.traceVideoQuality=JPEG quality of screencast frames, 1 to 100 (default 60; values outside that range keep the default).
GatfExecutorConfig.traceVideoEveryNthFrame=Keep every Nth screencast frame (default 2; 0 or less keeps the default).
GatfExecutorConfig.traceDomSnapshots=Per-action DOM snapshots for time-travel in the Trace Viewer: `off`, `lite` (sanitized DOM, no stylesheets) or `full` (styled). Unset uses `-Dgatf.trace.domSnapshots`, else `off`; unknown values mean `off`.
GatfExecutorConfig.traceDomSnapshotMaxMb=MB that per-action snapshots may add to one trace (HTML and stylesheets); capture stops past it. Unset or 0 and below means 32.
GatfExecutorConfig.gatfTestDataConfig=Inline test-data block: global variables, comparison URLs, data sources, data providers and data-source hooks (see `GatfTestDataConfig`). Replaced by the contents of `testDataConfigFile` when that is set.
GatfExecutorConfig.enabled=Plugin-style on/off flag; loaders fill `true` when unset. The executor does not read it to skip a run in 5.0.0.
GatfExecutorConfig.testCaseHooksPaths=Where to find Java pre/post test-case hooks (`@PreTestCaseExecutionHook`, `@PostTestCaseExecutionHook`): each entry is a package ending in `.*` (scanned) or a fully qualified class name, loaded from the project class path.

# Load, distributed and repeat runs
GatfExecutorConfig.loadTestingEnabled=Load-testing mode for API suites: the suite is re-run until `loadTestingTime` is up, with report samples taken along the way. It only applies when `loadTestingTime` is above 10000 ms and comparison mode is off.
GatfExecutorConfig.loadTestingTime=Length of a load-testing run, in ms (default 0). Load testing only runs when this is above 10000.
GatfExecutorConfig.distributedLoadTests=Spread load-testing runs across the listener nodes in `distributedNodes` (each node runs part of the simulated users).
GatfExecutorConfig.distributedNodes=Distributed listener nodes as `host` or `host@port` (default port 9567). Used when `distributedLoadTests` is `true` and load testing is on.
GatfExecutorConfig.concurrentUserRampUpTime=Ramp-up time for simulated users, in ms: each user starts `concurrentUserRampUpTime / concurrentUserSimulationNum` after the previous one. Used when there is more than one user and the value is above 0.
GatfExecutorConfig.loadTestingReportSamples=Number of report samples taken across a load-testing window, clamped to 3..100. The web console fills `3` when unset.
GatfExecutorConfig.debugEnabled=More verbose API logging: each request is logged as a detailed curl command, and cases marked `detailedLog` print their details. Also passed to the test generator.
GatfExecutorConfig.acceptAllCerts=Trust every TLS certificate and hostname on the API HTTP client (self-signed or mismatched certificates). The field defaults to `true` when absent from the config; `-Dgatf.acceptAllCerts=true` forces it on.
GatfExecutorConfig.ignoreFiles=API test files to skip. Patterns: `*.ext`, `prefix*`, `*suffix` or an exact name, matched on the file name, or on the path relative to the test directory when the pattern contains `\\`; `*` or `*.*` skips every file.
GatfExecutorConfig.orderedFiles=API test files (paths relative to the test directory) to run first, in this order; the remaining files follow. Takes precedence over `isOrderByFileName`.
GatfExecutorConfig.isOrderByFileName=Run API test files in alphanumeric file-name order (when `orderedFiles` is not set).
GatfExecutorConfig.isServerLogsApiAuthEnabled=Authenticate before calling the server-logs API: the auth case in `gatf-logging-api-int.xml` runs first and its token is extracted with `serverLogsApiAuthExtractAuth`.
GatfExecutorConfig.serverLogsApiAuthExtractAuth=Token extraction for the server-logs API auth case, in the same 4-part format as `authExtractAuth` (`tokenName,source,variable,usage`).
GatfExecutorConfig.isFetchFailureLogs=Load the server-logs API cases from `gatf-logging-api-int.xml` in `testCasesBasePath` at start-up, so the server's logs can be fetched for failed cases from the reports.
GatfExecutorConfig.repeatSuiteExecutionNum=Run the API suite this many times in a row; above 1 the repeat loop is used and every pass is reported (default 0 = once).
GatfExecutorConfig.isGenerateExecutionLogs=Write a per-case execution log (a CSV file with a random name) into the out directory during API runs.

# seleasy suites
GatfExecutorConfig.isSeleniumExecutor=Run a seleasy UI suite (`seleniumScripts` / `seleniumScript`) instead of an API suite.
GatfExecutorConfig.isSeleniumModuleTests=Module mode: every `main.sel` under the test-case directory is a script. Read by the web console's file list (which then hides other `.sel` files), `gatf changed` and distributed nodes.
GatfExecutorConfig.seleniumScripts=The seleasy scripts to run, as paths relative to the test-case directory. Replaced by the expansion of `seleniumScript` when that is set.
GatfExecutorConfig.seleniumScript=One entry that expands to the script list: a folder under the test-case directory (every `*.sel` in it), a single `.sel`, or a list file with one script per line. When set it replaces `seleniumScripts`.
GatfExecutorConfig.seleniumScriptRetryCount=Re-run failed UI scripts for up to this many extra rounds (default 0). Above 0 it turns load testing and simulated users off; `globalTeardown` runs after the last round.
GatfExecutorConfig.sessionId=@internal run session id, set to `System.nanoTime()` at the start of a UI run when null and used in report and retry ids.
GatfExecutorConfig.seleniumDriverConfigs=Per-browser driver settings (see `SeleniumDriverConfig`). Only entries named `chrome`, `firefox`, `ie`, `opera`, `edge`, `safari`, `appium-android`, `appium-ios`, `selendroid` or `ios-driver` are used for `open`; other browser keys get built-in defaults.
GatfExecutorConfig.seleniumLoggerPreferences=Legacy WebDriver logging preferences such as `browser(OFF),driver(OFF),performance(OFF)`. Parsed when a browser is set up, but in 5.0.0 no value enables any log type.
GatfExecutorConfig.javaHome=JDK home directory, overridable with `D_JAVA_HOME`. In 5.0.0 it is only copied into distributed-run contexts; nothing uses it to choose a JVM.
GatfExecutorConfig.javaVersion=@internal set to the running JVM's `java.version` when the config is loaded; a distributed node refuses a run from a newer Java version.
GatfExecutorConfig.gatfJarPath=GATF jar added to the class path used to compile generated seleasy Java; unset means the jar GATF is running from. `D_GATF_JAR` overrides it in memory.
GatfExecutorConfig.selConcWebdriver=Use real locks around shared WebDriver access in generated scripts (`true`); `false` (default) uses no-op locks.
GatfExecutorConfig.wrkPath=Path to the `wrk` binary. A configured path that exists wins; otherwise the tools cache, then `PATH`, then `docker exec` into the load-generator container; if none works the test falls back to vegeta.
GatfExecutorConfig.wrk2Path=Path to the `wrk2` binary, resolved like `wrkPath` (configured, tools cache, `PATH`, Docker container, else vegeta fallback).
GatfExecutorConfig.vegetaPath=Path to the `vegeta` binary. When unset or missing GATF uses the tools cache, then `PATH`, then downloads the official release (SHA-256 checked).
GatfExecutorConfig.autocannonPath=Path to an `autocannon` command. When unset or missing GATF installs autocannon into the tools cache with npm and runs it with node (`nodePath`, `PATH` or a portable download).
GatfExecutorConfig.wperfkPath=Path to the `wperfk` binary, the default load engine. When unset or missing GATF uses the tools cache, then `PATH`, then downloads the release (SHA-256 checked); if that fails the test falls back to vegeta.
GatfExecutorConfig.nodePath=Path to the `node` binary used to run autocannon; when unset or missing GATF uses `node` on `PATH`, else a portable Node LTS download (SHA-256 checked).
GatfExecutorConfig.perfToolContainer=Docker container that `wrk`/`wrk2` run in through `docker exec` when no host binary is found. Unset uses `$GATF_PERF_CONTAINER`, else `gatf-loadgen`.
GatfExecutorConfig.extraProperties=JVM system properties applied when a single seleasy script is validated or run on its own. Recognised keys, checked in this order with only the first one present applied: `jdk.tls.client.protocols`, `crypto.policy`, `webdriver.http.factory`, `jna.library.path`.
GatfExecutorConfig.mailSimulator=Embedded mail server started with the run (see `MailSimulatorConfig`).
GatfExecutorConfig.ai=Opt-in AI provider used by the healer and the planner (see `AiConfig`). Absent means AI is not configured and nothing calls a model.
GatfExecutorConfig.htttpServerSimulator=Embedded HTTP server started with the run (see `HttpServerSimulatorConfig`). The key really is spelled `htttpServerSimulator`, with three `t`s.
GatfExecutorConfig.autoPauseOnElNotFound=When an element search in a UI script times out, pause the script at that line (resume, restart or stop it from the web console) instead of failing. Default `false`.
GatfExecutorConfig.waitOnWarnException=Time to wait after a subtest ends with a warning before the script continues, in ms (checked in 1 s steps; stop and restart requests are honoured). Default 0 = no wait.
GatfExecutorConfig.waitOnFailException=Time to wait after a subtest fails before the script goes on, in ms (checked in 1 s steps; stop and restart requests are honoured). Default 0 = no wait.
GatfExecutorConfig.authExtractAuth_=@internal cache of `authExtractAuth` split on commas and trimmed.
GatfExecutorConfig.serverLogsApiAuthExtractAuth_=@internal cache of `serverLogsApiAuthExtractAuth` split on commas and trimmed.
GatfExecutorConfig.authParamsDetails_=@internal cache of `authParamsDetails` split on commas and trimmed.
GatfExecutorConfig.soapAuthExtractAuth_=@internal cache of `soapAuthExtractAuth` split on commas and trimmed.

# Test data
GatfTestDataConfig=The `gatfTestDataConfig` block (inline in the executor config, or the whole of `testDataConfigFile`): global variables, comparison URLs, data sources, data providers and data-source hooks. It is set up when the run's context is initialised.
GatfTestDataConfig.globalVariables=Name/value map of project-wide variables, available as `${name}` in API cases and seleasy scripts.
GatfTestDataConfig.compareEnvBaseUrls=Extra environment base URLs for comparison runs (`compareEnabled`); each case is replayed against `baseUrl` and each of these.
GatfTestDataConfig.dataSourceList=Data sources (database connections) that providers and hooks refer to by name.
GatfTestDataConfig.providerTestDataList=Data providers: named sets of variable rows used by API cases (`repeatScenarioProviderName`, `authDataProvider`) and seleasy loops.
GatfTestDataConfig.dataSourceHooks=Named query lists run against a data source on start-up, on shutdown, or around a test case (`preExecutionDataSourceHookName` / `postExecutionDataSourceHookName`).
GatfTestDataConfig.dataSourceListForProfiling=Separate data sources (pool size forced to 1) used only by the web console's data-source profiling view, together with `profile-providers.xml`.
GatfTestDataSource=One entry of `dataSourceList`: a named, pooled connection. Use `com.gatf.executor.dataprovider.SQLDatabaseTestDataSource` (args: JDBC URL, driver class, user, password), `com.gatf.executor.dataprovider.MongoDBTestDataSource` (args: host, port, database, optional user and password) or a custom class implementing `TestDataSource`.
GatfTestDataSource.dataSourceName=Unique name of the data source; providers and hooks refer to it through their `dataSourceName`. Required.
GatfTestDataSource.dataSourceClass=Implementation class: one of the built-in SQL or MongoDB classes, or a custom class from the project class path that implements `TestDataSource`. Required.
GatfTestDataSource.poolSize=Number of pooled connections (default 1; values of 1 or less keep 1).
GatfTestDataSource.newResourceCheckoutTimeMs=Intended connection checkout wait, in ms (default 1000). Not passed to the data source in 5.0.0, so changing it has no effect.
GatfTestDataSource.args=Connection arguments, in the order the class expects (see `GatfTestDataSource`). Required and non-empty.
GatfTestDataProvider=One entry of `providerTestDataList`: a named source of variable rows. Rows come either from a data source query (`dataSourceName` + `queryStr`) or from a `providerClass`; set exactly one of the two.
GatfTestDataProvider.dataSourceName=Data source to query for rows (instead of `providerClass`). SQL sources need `queryStr`; MongoDB sources need `queryStr` and `sourceProperties`.
GatfTestDataProvider.providerName=Unique name of the provider, used by test cases, `authDataProvider` and seleasy `#provider` loops. Required.
GatfTestDataProvider.providerClass=Provider implementation instead of a data source: `com.gatf.executor.dataprovider.FileTestDataProvider`, `StateFulFileTestDataProvider`, `InlineValueTestDataProvider`, `RandomValueTestDataProvider` (same package), or a custom class implementing `TestDataProvider`.
GatfTestDataProvider.sourceProperties=MongoDB providers: comma-separated document property names to read, paired by position with `providerProperties`. Required for MongoDB.
GatfTestDataProvider.providerProperties=Comma-separated variable names each row provides (the column names). Required for every provider.
GatfTestDataProvider.queryStr=Query run against the data source: SQL for SQL sources, a JSON filter for MongoDB. For `live` providers it is templated against the calling test case first.
GatfTestDataProvider.enabled=Set it to `true`. In 5.0.0 an unset value means disabled (the log says `Provider <name> is Disabled...`), although the loader intends `true`; a disabled provider is registered but returns no rows.
GatfTestDataProvider.args=Provider arguments. File providers: file path and type (`csv`, `xls`, `xlsx`, `xml` or `json`). Inline: one comma-separated row per arg (optional first arg `quoted=true`). Random: comma-separated value types and a row count. MongoDB: the collection name.
GatfTestDataProvider.live=When `true` the rows are fetched again on every use (with `queryStr` templated against the test case) instead of once at start-up.
GatfTestDataSourceHook=One entry of `dataSourceHooks`: a named list of queries run against a data source at start-up, at shutdown, or when a test case names it as its pre/post execution hook.
GatfTestDataSourceHook.hookName=Unique name of the hook, referenced by `preExecutionDataSourceHookName` / `postExecutionDataSourceHookName` on test cases. Required.
GatfTestDataSourceHook.hookClass=Custom hook class to run the queries instead of a data source; set either this or `dataSourceName`, not both.
GatfTestDataSourceHook.dataSourceName=Data source the queries run against; set either this or `hookClass`.
GatfTestDataSourceHook.queryStrs=The queries to run, in order. Required. At start-up and shutdown a failing query is logged; run from a test case, a failing query fails the case.
GatfTestDataSourceHook.executeOnStart=Run the queries when the test data is initialised (default `false`).
GatfTestDataSourceHook.executeOnShutdown=Run the queries when the run shuts down (default `false`).

# Browsers
SeleniumDriverConfig=One entry of `seleniumDriverConfigs`: the settings `open <name>` uses to create a browser (driver binary, arguments, capabilities, preferences, remote URL).
SeleniumDriverConfig.name=Browser key this entry configures, as written after `open` (e.g. `chrome`, `firefox`, `edge`, `appium-android`).
SeleniumDriverConfig.version=Appium entries only: the device platform version (sent as `appium:platformVersion`).
SeleniumDriverConfig.platform=Not read by the executor in 5.0.0.
SeleniumDriverConfig.driverName=JVM system property that points the driver at its binary (e.g. `webdriver.chrome.driver`); it is set to `path` when that file exists.
SeleniumDriverConfig.path=Path to the driver binary (e.g. chromedriver), applied through `driverName` when the file exists. `D_CHROME_DRIVER` / `D_FF_DRIVER` override it for Chrome and Firefox in the web console.
SeleniumDriverConfig.arguments=Browser command-line arguments, separated by spaces. GATF adds its own managed flags (e.g. `--ignore-certificate-errors`, `--remote-allow-origins=*` for Chrome) without duplicating them. For Chrome keys 5.0.0 hands the whole string (managed flags included) to the browser as one argument, so only the first switch takes effect: give a single switch such as `--headless=new`.
SeleniumDriverConfig.url=Remote endpoint for `remote-*` and Appium entries; unset means `http://127.0.0.1:4723/wd/hub` for `remote-*`. For Appium an environment or system-property URL wins over it.
SeleniumDriverConfig.capabilities=Extra capabilities (name to value) set on the browser options. The keys `logconsole`, `logdebug` and `lognw` (`1`, `on` or `true`) are not sent: they turn on GATF's console, debug and network logging.
SeleniumDriverConfig.properties=Browser preferences: Chrome `prefs` (experimental option) or Firefox profile preferences.

# Simulators
MailSimulatorConfig=The `mailSimulator` block: an embedded mail server (SMTP and IMAP, via GreenMail) with one mailbox, started with the run so scripts can send and check mail.
MailSimulatorConfig.enabled=Start the mail simulator (default `false`).
MailSimulatorConfig.login=Mailbox user name. Required when enabled.
MailSimulatorConfig.password=Mailbox password. Required when enabled; keep real secrets out of shared configs.
MailSimulatorConfig.isSecure=Use SMTPS and IMAPS instead of plain SMTP and IMAP (default `false`).
MailSimulatorConfig.smtpPort=SMTP port; must be above 100 when enabled.
MailSimulatorConfig.imapPort=IMAP port; must be above 100 when enabled.

# AI provider
AiConfig.model=Model id sent to the provider. Required: without it AI stays unconfigured.
AiConfig.timeoutMs=Timeout per AI call, in ms (default 30000, clamped to 1000..600000).
AiConfig.retries=Retries per call on timeouts, I/O errors, HTTP 429 and 5xx, with exponential backoff (default 2, clamped to 0..5). Other 4xx responses are not retried.
AiConfig.maxCallsPerRun=Most calls one AI session (one healer or planner run) may make (default 10, clamped to 1..1000).
AiConfig.maxTokensPerRun=Token budget (input plus output) for one AI session (default 50000, clamped to 1..10000000). Without usage data from the provider, tokens are estimated at about 4 characters each.
AiConfig.maxOutputTokens=Most output tokens requested per call (default 1024, clamped to 16..32000), and never more than the session's remaining token budget.
AiConfig.maxCostPerRun=Cost budget for one AI session, in the currency of `inputCostPerMTok` / `outputCostPerMTok`. Unset = no cost limit.
AiConfig.inputCostPerMTok=Price per million input tokens, used to track cost against `maxCostPerRun`.
AiConfig.outputCostPerMTok=Price per million output tokens, used to track cost against `maxCostPerRun`.

HttpServerSimulatorConfig=The `htttpServerSimulator` block (three `t`s): an embedded HTTP server started with the run that answers every request with status 200 and the configured body and headers.
HttpServerSimulatorConfig.enabled=Start the HTTP simulator (default `false`).
HttpServerSimulatorConfig.port=Port to listen on; must be 80 or above when enabled.
HttpServerSimulatorConfig.body=Response body returned for every request. Required when enabled.
HttpServerSimulatorConfig.headers=Response headers (name to value) returned with every response.
