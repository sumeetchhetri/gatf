name: Build gatf

on:
  push:
    branches:
      - master

jobs:
  push:
    runs-on: ubuntu-latest
    #if: contains(github.event.head_commit.message, '[docker_push]') && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v2

    - name: Setup JDK 21 (Maven builds with <release>21</release>)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Seleasy smoke (offline lint + command catalog)
      run: python3 tools/smoke/sel-lint.py --regen sample/*.sel

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Apache-2.0 license headers (source code files)
      run: node tools/license/license-headers.mjs --check

    - name: Frontend unit tests (vitest)
      run: |
        cd frontend
        npm ci
        npm test

    - name: VS Code extension (typecheck, bundle, grammar tests)
      run: |
        cd vscode-extension
        npm ci
        npx tsc --noEmit
        node esbuild.mjs
        node test/grammar.test.mjs

    - name: Build gatf jar (runs backend unit + integration tests via surefire/failsafe)
      run: |
        mvn --quiet install
        docker build . --file Dockerfile
