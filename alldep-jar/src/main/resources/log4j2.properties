# GATF logging (log4j2)
#
# Console: level via -Dgatf.console.level (default info). CLI test runs (-executor / -selenium) default it to warn,
#          because the pass/fail reporter (com.gatf.log.RunConsole) owns the console there.
# File:    <gatf.log.dir|logs>/gatf.log, detailed (thread, full logger name, stack traces). The previous run's log is
#          rolled to gatf.1.log.gz on start (last 10 kept), and a log is also rolled at 20MB.
#          Level via -Dgatf.log.level (default info; debug for more).
# During CLI runs, System.out / System.err are captured into the gatf.stdout / gatf.stderr loggers, which write to
# the file only. See com.gatf.log.GatfLogging.
status = warn
name = gatf

appender.console.type = Console
appender.console.name = CONSOLE
# gatf mcp sets -Dgatf.console.target=SYSTEM_ERR: its stdout carries only the protocol
appender.console.target = ${sys:gatf.console.target:-SYSTEM_OUT}
# write to the real fd, not System.out (which a CLI run redirects into the log)
appender.console.direct = true
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-5level] %d{HH:mm:ss.SSS} %c{1} - %msg%n
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = ${sys:gatf.console.level:-info}

appender.file.type = RollingFile
appender.file.name = FILE
appender.file.fileName = ${sys:gatf.log.dir:-logs}/gatf.log
appender.file.filePattern = ${sys:gatf.log.dir:-logs}/gatf.%i.log.gz
appender.file.createOnDemand = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %c - %msg%n
appender.file.policies.type = Policies
appender.file.policies.startup.type = OnStartupTriggeringPolicy
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 20MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10
# gatf.1.log.gz = the most recent previous run
appender.file.strategy.fileIndex = min

rootLogger.level = ${sys:gatf.log.level:-info}
rootLogger.appenderRef.console.ref = CONSOLE
rootLogger.appenderRef.file.ref = FILE

# captured System.out / System.err and the per-test result log: file only (the console has RunConsole)
logger.stdout.name = gatf.stdout
logger.stdout.level = info
logger.stdout.additivity = false
logger.stdout.appenderRef.file.ref = FILE

logger.stderr.name = gatf.stderr
logger.stderr.level = info
logger.stderr.additivity = false
logger.stderr.appenderRef.file.ref = FILE

logger.run.name = gatf.run
logger.run.level = info
logger.run.additivity = false
logger.run.appenderRef.file.ref = FILE
