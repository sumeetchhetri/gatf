openapi: 3.0.3
info:
  title: Swagger Petstore - OpenAPI 3.0
  version: 1.0.19
servers:
  - url: https://{env}.swagger.io/api/v3
    variables:
      env:
        default: petstore3
        enum: [petstore3, staging]
tags:
  - name: pet
  - name: store
  - name: user
paths:
  /pet:
    put:
      tags: [pet]
      summary: Update an existing pet
      operationId: updatePet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
            application/xml:
              schema: { $ref: '#/components/schemas/Pet' }
        '400': { description: Invalid ID supplied }
      security:
        - petstore_auth: [write:pets, read:pets]
    post:
      tags: [pet]
      summary: Add a new pet to the store
      operationId: addPet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '405': { description: Invalid input }
      callbacks:
        onPetAdded:
          '{$request.body#/callbackUrl}':
            post:
              responses:
                '200': { description: ok }
      security:
        - petstore_auth: [write:pets, read:pets]
  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Finds Pets by status
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          required: false
          explode: true
          schema:
            type: string
            default: available
            enum: [available, pending, sold]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
        '400': { description: Invalid status value }
      security:
        - petstore_auth: [write:pets, read:pets]
  /pet/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [pet]
      summary: Find pet by ID
      operationId: getPetById
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
          links:
            deletePet:
              operationId: deletePet
        '404': { description: Pet not found }
      security:
        - api_key: []
        - petstore_auth: [write:pets, read:pets]
    delete:
      tags: [pet]
      summary: Deletes a pet
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          required: false
          schema: { type: string }
      responses:
        '400': { description: Invalid pet value }
      security:
        - petstore_auth: [write:pets, read:pets]
  /pet/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: uploads an image
      operationId: uploadFile
      parameters:
        - $ref: '#/components/parameters/PetId'
        - name: additionalMetadata
          in: query
          required: false
          schema: { type: string }
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
      security:
        - petstore_auth: [write:pets, read:pets]
  /store/inventory:
    get:
      tags: [store]
      summary: Returns pet inventories by status
      operationId: getInventory
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, format: int32 }
      security:
        - api_key: []
  /store/order:
    post:
      tags: [store]
      summary: Place an order for a pet
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
            examples:
              simple:
                $ref: '#/components/examples/SimpleOrder'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '405': { description: Invalid input }
  /user/login:
    get:
      tags: [user]
      summary: Logs user into the system
      operationId: loginUser
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
          example: theUser
        - name: password
          in: query
          required: true
          schema: { type: string, format: password }
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { type: string }
        '400': { description: Invalid username/password supplied }
  /user/logout:
    get:
      tags: [user]
      summary: Logs out current logged in user session
      operationId: logoutUser
      responses:
        default: { description: successful operation }
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema: { type: integer, format: int64, example: 10 }
  requestBodies:
    Pet:
      description: Pet object that needs to be added to the store
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pet' }
        application/xml:
          schema: { $ref: '#/components/schemas/Pet' }
  examples:
    SimpleOrder:
      value: { id: 10, petId: 198772, quantity: 7, status: approved, complete: true }
  schemas:
    Order:
      type: object
      properties:
        id: { type: integer, format: int64, example: 10 }
        petId: { type: integer, format: int64, example: 198772 }
        quantity: { type: integer, format: int32, example: 7 }
        shipDate: { type: string, format: date-time }
        status: { type: string, example: approved, enum: [placed, approved, delivered] }
        complete: { type: boolean }
    Category:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Dogs }
    Tag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Pet:
      required: [name, photoUrls]
      type: object
      properties:
        id: { type: integer, format: int64, example: 10, readOnly: true }
        name: { type: string, example: doggie }
        category: { $ref: '#/components/schemas/Category' }
        photoUrls:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        status: { type: string, description: pet status in the store, enum: [available, pending, sold] }
    ApiResponse:
      type: object
      properties:
        code: { type: integer, format: int32 }
        type: { type: string }
        message: { type: string }
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes: { write:pets: modify pets, read:pets: read your pets }
    api_key:
      type: apiKey
      name: api_key
      in: header
